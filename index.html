var CH='painel_acesso';
function d64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function e64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function ler(st){try{var v=JSON.parse(st.getItem(CH)||'null');return v&&v.s===P.s?v.k:null}catch(e){return null}}
function gravar(st,k){try{st.setItem(CH,JSON.stringify({s:P.s,k:k}))}catch(e){}}
function apagar(){try{localStorage.removeItem(CH)}catch(e){}try{sessionStorage.removeItem(CH)}catch(e){}}
function abrir(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.i)},k,d64(P.c));
  }).then(function(pt){
    var h=new TextDecoder().decode(pt);
    return new Promise(function(ok){
      function troca(){setTimeout(function(){document.open();document.write(h);document.close();ok()},0)}
      if(document.readyState==='complete')troca();else window.addEventListener('load',troca);
    });
  });
}
function mostrar(){document.body.className='pronto';try{document.getElementById('pw').focus()}catch(e){}}
var salvo=ler(localStorage)||ler(sessionStorage);
if(salvo){abrir(d64(salvo)).catch(function(){apagar();mostrar()})}else{mostrar()}
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var pw=document.getElementById('pw').value,bt=document.getElementById('bt'),er=document.getElementById('er'),lem=document.getElementById('lem').checked;
  er.textContent='';bt.disabled=true;bt.textContent='Abrindo...';
  crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(b){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:d64(P.s),iterations:P.n,hash:'SHA-256'},b,256);
  }).then(function(bits){
    var raw=new Uint8Array(bits),k=e64(raw);
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.i)},key,d64(P.c));
    }).then(function(){
      gravar(sessionStorage,k);
      if(lem)gravar(localStorage,k);
      return abrir(raw);
    });
  }).catch(function(){
    bt.disabled=false;bt.textContent='Entrar';er.textContent='Senha incorreta.';
  });
});
})();
