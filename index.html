.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.logo{height:28px;width:auto;display:block}
.chip{font-size:11px;font-weight:600;background:var(--amarelo);color:#2b2100;border-radius:99px;padding:3px 10px}
.periodo{margin-left:auto;text-align:right;display:flex;flex-direction:column}
.periodo b{font-size:15px;font-weight:700}
.periodo span{font-size:11px;color:var(--ink-2)}
.grid{min-height:0;display:grid;gap:10px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1.1fr) minmax(0,1fr);
  grid-template-areas:"mapa kpis" "mapa status" "mapa evol"}
.card{background:rgba(10,100,114,.92);border-radius:12px;padding:10px 12px;min-height:0;min-width:0;display:flex;flex-direction:column}
h2{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--lima);margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{grid-area:kpis;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi .lbl{font-size:11px;font-weight:500;line-height:1.2}
.kpi .val{font-size:clamp(20px,3.2vh,30px);font-weight:700;line-height:1.1}
.kpi .sub{font-size:10px;opacity:.9;line-height:1.2}
.k1{background:var(--verde)} .k2{background:var(--roxo)} .k3,.k4{background:var(--teal-3)} .k3 .val{color:var(--amarelo)}
.mapa{grid-area:mapa}
.mapbox{flex:1;min-height:0;position:relative;overflow:hidden}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.uf{fill:var(--teal-3);stroke:var(--teal);stroke-width:1}
.rota{fill:none;stroke-width:2.4;stroke-linecap:round}
.rota.desl{stroke:var(--amarelo);stroke-dasharray:6 6;animation:anda 1.4s linear infinite}
.rota.atend{stroke:var(--verde-claro);stroke-dasharray:2 6}
@keyframes anda{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.rota.desl{animation:none}}
.lbl-s{fill:#d9c4ff;font-weight:700}
.pt-saida{fill:var(--roxo);stroke:var(--ink);stroke-width:1.2}
.pt-dest{fill:var(--verde-claro);stroke:var(--teal);stroke-width:1.5}
.lbl-c{fill:var(--ink);font-size:calc(var(--u,1) * 12px);font-family:var(--font);font-weight:500;paint-order:stroke;stroke:var(--teal);stroke-width:calc(var(--u,1) * 3px)}
.rota{stroke-width:calc(var(--u,1) * 2.4px)!important}
.uf{stroke-width:calc(var(--u,1) * 1px)}
.legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink-2)}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.status{grid-area:status;display:flex;gap:10px;min-height:0}
.status .grupo{flex:1 1 0;min-width:0}
.status .grupo.vz{flex:0 0 auto;max-width:30%}
.status .grupo.vz h3{white-space:normal}
.grupo ul:empty{display:none}
.grupo{border-radius:0 0 12px 12px;padding:8px 10px;background:rgba(10,100,114,.92);min-height:0;display:flex;flex-direction:column}
.grupo .hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.grupo h3{margin:0;font-size:13px;font-weight:600;white-space:nowrap}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:1px 10px;color:#1c1500}
.g-desl{border-top:3px solid var(--amarelo)} .g-desl .pill{background:var(--amarelo)}
.g-atend{border-top:3px solid var(--verde-claro)} .g-atend .pill{background:var(--verde-claro);color:#06331f}
.grupo ul{list-style:none;margin:0;padding:0;flex:1;overflow:hidden;min-height:0;column-gap:8px;font-size:13px}
.grupo li{font-size:1em;line-height:1.25;padding:.32em .6em;margin-bottom:.32em;background:rgba(0,0,0,.16);border-radius:7px;display:flex;align-items:baseline;gap:.4em;white-space:nowrap;break-inside:avoid}
.grupo li b{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.grupo li .cid{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.grupo li .seta{color:var(--ink-2)}
.grupo li.sep{background:none;padding:.5em .2em .2em;margin:.2em 0 .3em;border-top:1px solid var(--line);border-radius:0;font-size:.82em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--lima);justify-content:space-between;align-items:center}
.grupo li.sep .pf{background:var(--lima);color:#2a3300;font-size:1em;letter-spacing:0;padding:0 .7em}
.grupo li.fin .dias{display:block;color:var(--lima);font-weight:600}
.grupo ul.duas li .dias,.grupo ul.duas li.fin .dias{display:none}
.grupo ul.duas li:not(.sep){white-space:normal;flex-wrap:wrap;row-gap:0}
.grupo ul.duas li.sep{column-span:all;-webkit-column-span:all}
.grupo ul.duas li b,.grupo ul.duas li .cid{overflow:visible;text-overflow:clip}
.grupo li.nada{background:none;padding:.1em .2em;color:var(--ink-2);font-size:.9em}
.grupo li .dias{margin-left:auto;padding-left:.4em;font-size:.78em;color:var(--ink-2);flex:none}
.evol{grid-area:evol;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;min-height:0}
.chart{flex:1;min-height:0;position:relative}
.chart svg{position:absolute;inset:0;width:100%;height:100%}
.vazio{font-size:12px;color:var(--ink-2);margin:2px 0 0}
.semcid{font-size:10px;color:var(--ink-2);margin-left:auto}
.rodape{font-size:10px;color:var(--ink-2);margin-top:4px}
.status.sem-desl{flex-direction:column;gap:8px}
.status.sem-desl .grupo.vz{flex:none;max-width:none;flex-direction:row;align-items:center;gap:10px;padding:6px 10px}
.status.sem-desl .grupo.vz .hd{margin:0;flex-wrap:nowrap}
.status.sem-desl .grupo.vz h3{white-space:nowrap}
.status.sem-desl .grupo.vz .vazio{margin:0;font-size:12px}
@media (orientation:portrait),(max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1.15fr) minmax(0,1.3fr) minmax(0,.72fr);
    grid-template-areas:"kpis" "mapa" "status" "evol"}
  .mapa .legenda{display:none}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .kpi{padding:6px 8px}
  .kpi .sub{display:none}
  .legenda{font-size:10px;gap:2px 8px}
  .lbl-c{font-size:calc(var(--u,1) * 9px)}
  .periodo span{display:none}
  .grupo li .dias{display:none}
  .grupo li{padding:.12em .45em;margin-bottom:.16em}
  .grupo{padding:6px 8px}
  .grupo .hd{margin-bottom:4px}
  .status.sem-desl{gap:6px}
  .status.sem-desl .grupo.vz .vazio{font-size:11px}
}
@media (max-height:480px) and (orientation:landscape){.kpi .sub{display:none}}
</style>

function ajustaLista(){['l-desl','l-atend'].forEach(id=>{const ul=$(id);if(!ul.children.length)return;
 ul.style.columnCount=1;ul.classList.remove('duas');let f=13;ul.style.fontSize=f+'px';
 const cabe=()=>{if(ul.scrollHeight>ul.clientHeight+1||ul.scrollWidth>ul.clientWidth+1)return false;const b=ul.getBoundingClientRect();return [...ul.children].every(c=>{const r=c.getBoundingClientRect();return r.bottom<=b.bottom+1&&r.right<=b.right+1})};
 while(!cabe()&&f>11){f-=.5;ul.style.fontSize=f+'px'}
 if(!cabe()){ul.style.columnCount=2;ul.classList.add('duas');f=13;ul.style.fontSize=f+'px';while(!cabe()&&f>6.5){f-=.5;ul.style.fontSize=f+'px'}}
})}

Object.entries(dests).forEach(([c,p])=>{const k=el('circle',{cx:p[0],cy:p[1],r:5,class:'pt-dest'});k.appendChild(el('title',{},c));g.appendChild(k)});

const LB=[];Object.entries(dests).forEach(([c,p])=>LB.push({c,p,s:0}));Object.entries(saidas).forEach(([c,p])=>{if(!(c in dests))LB.push({c,p,s:1})});
LB.forEach(l=>{l.t=el('text',{class:'lbl-c'+(l.s?' lbl-s':'')},l.c);g.appendChild(l.t)});
let VB=null;
(function zoom(){const pts=[...Object.values(saidas),...Object.values(dests)];if(!pts.length)return;
 let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
 const cel=matchMedia('(orientation:portrait),(max-width:760px)').matches;const px=cel?55:75,py=cel?25:35;x0-=px;y0-=py;x1+=px;y1+=py;let w=x1-x0,h=y1-y0;const mw=cel?150:260;
 if(w<mw){x0-=(mw-w)/2;w=mw} if(h<mw*.9){y0-=(mw*.9-h)/2;h=mw*.9}
 VB=[x0,y0,w,h];$('mapa').setAttribute('viewBox',`${x0} ${y0} ${w} ${h}`);})();
function escala(){const sv=$('mapa');const r=sv.getBoundingClientRect();if(!r.width)return;
 const vb=VB||[0,0,665,614];const u=Math.max(vb[2]/r.width,vb[3]/r.height);
 sv.style.setProperty('--u',u);sv.querySelectorAll('circle').forEach(c=>c.setAttribute('r',(c.classList.contains('pt-saida')?6:5)*u));rotulos(u);}
function rotulos(u){
 const pts=LB.map(l=>l.p).concat(Object.values(saidas));const R=7*u;
 const hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
 const pbox=pts.map(p=>({x:p[0]-R,y:p[1]-R,w:2*R,h:2*R}));
 const placed=[];
 const cr0=$('mapa').getBoundingClientRect();
 const ord=[...LB].sort((a,b)=>(cr0.width<520?b.s-a.s:0)||a.p[1]-b.p[1]||a.p[0]-b.p[0]);
 
 ord.forEach(l=>{l.t.style.display='';const [x,y]=l.p,o=9*u,h=12*u;
  const C=[];const base=l.s?['l','r']:['r','l'];
  for(const k of [0,1,-1,2,-2,3,-3,4,-4])for(const sd of base)C.push([sd,k*h*.95]);
  C.push(['t',0],['b',0]);
  let best=null,bs=1e9;
  for(const [sd,dy] of C){const t=l.t;
   if(sd=='r'){t.setAttribute('text-anchor','start');t.setAttribute('x',x+o);t.setAttribute('y',y+4*u+dy)}
   else if(sd=='l'){t.setAttribute('text-anchor','end');t.setAttribute('x',x-o);t.setAttribute('y',y+4*u+dy)}
   else if(sd=='t'){t.setAttribute('text-anchor','middle');t.setAttribute('x',x);t.setAttribute('y',y-o)}
   else{t.setAttribute('text-anchor','middle');t.setAttribute('x',x);t.setAttribute('y',y+o+10*u)}
   const b=t.getBBox();const bb={x:b.x-2*u,y:b.y-1*u,w:b.width+4*u,h:b.height+2*u};
   const vb=VB||[0,0,665,614];const sm=$('mapa'),cr=sm.getBoundingClientRect(),sc0=Math.max(vb[2]/cr.width,vb[3]/cr.height),vw=cr.width*sc0,vx=vb[0]-(vw-vb[2])/2,vh=cr.height*sc0,vy=vb[1]-(vh-vb[3])/2;
   let sc=placed.filter(q=>hit(bb,q)).length*10+Math.min(2,pbox.filter(q=>hit(bb,q)).length)*3+Math.abs(dy)/h*.5+(sd==base[0]?0:.2)+((bb.x<vx||bb.x+bb.w>vx+vw)?8:0)+((bb.y<vy||bb.y+bb.h>vy+vh)?8:0);
   if(sc<bs){bs=sc;best=[sd,dy,bb]} if(sc<.01)break}
  const [sd,dy,bb]=best;const t=l.t;
  if(sd=='r'){t.setAttribute('text-anchor','start');t.setAttribute('x',x+o);t.setAttribute('y',y+4*u+dy)}
  else if(sd=='l'){t.setAttribute('text-anchor','end');t.setAttribute('x',x-o);t.setAttribute('y',y+4*u+dy)}
  else if(sd=='t'){t.setAttribute('text-anchor','middle');t.setAttribute('x',x);t.setAttribute('y',y-o)}
  else{t.setAttribute('text-anchor','middle');t.setAttribute('x',x);t.setAttribute('y',y+o+10*u)}
  if(l.ln){l.ln.remove();l.ln=null}
  if(bs>=8){t.style.display='none';return}
  placed.push(bb);
  const old=l.ln;if(old)old.remove();
  if(Math.abs(dy)>1e-6){l.ln=el('line',{x1:x,y1:y,x2:sd=='r'?x+o-2*u:x-o+2*u,y2:y+dy,stroke:'rgba(252,249,242,.5)','stroke-width':.8*u});g.insertBefore(l.ln,g.firstChild)}else l.ln=null;
 });}
escala();
const TX={fill:'#FCF9F2','font-family':'Montserrat,sans-serif'};
function semanas(){const box=$('c-sem');box.innerHTML='';const W=box.clientWidth,H=box.clientHeight;if(W<20||H<30)return;
 const S=D.semanas;const s=el('svg',{viewBox:`0 0 ${W} ${H}`});const top=22,bot=28,n=S.length,gap=Math.max(6,W*.04),bw=(W-gap*(n-1))/n,ah=H-top-bot;
 S.forEach((d,i)=>{const x=i*(bw+gap);
  if(d.p==null){s.appendChild(el('rect',{x:x+.75,y:H-bot-ah*.25,width:bw-1.5,height:ah*.25,fill:'none',stroke:'rgba(252,249,242,.3)','stroke-dasharray':'4 4',rx:5}));
   s.appendChild(el('text',{...TX,x:x+bw/2,y:H-bot-ah*.25-5,'text-anchor':'middle','font-size':10,fill:'#cfe0de'},bw>44?(d.futura?'aguarda':'sem dados'):'–'))}
  else{const h=Math.max(2,ah*d.p/100);s.appendChild(el('rect',{x,y:H-bot-h,width:bw,height:h,rx:5,fill:d.atual?'#0F967D':'#8244EB'}));
   s.appendChild(el('text',{...TX,x:x+bw/2,y:H-bot-h-4,'text-anchor':'middle','font-size':bw<40?10:12,'font-weight':700},d.p+'%'))}
  s.appendChild(el('text',{...TX,x:x+bw/2,y:H-14,'text-anchor':'middle','font-size':11,'font-weight':600},d.n));
  s.appendChild(el('text',{...TX,x:x+bw/2,y:H-2,'text-anchor':'middle','font-size':Math.min(9,bw/3.4),fill:'#cfe0de'},d.d))});
 box.appendChild(s)}
function ano(){const box=$('c-ano');box.innerHTML='';const W=box.clientWidth,H=box.clientHeight;if(W<20||H<30)return;
 const A=D.meses.filter(m=>m[1]!=null);if(!A.length)return;
 const s=el('svg',{viewBox:`0 0 ${W} ${H}`});const x0=30,x1=W-14,y0=H-18,y1=18,min=0,max=100;
 const X=i=>A.length==1?(x0+x1)/2:x0+i*(x1-x0)/(A.length-1),Y=v=>y0-(v-min)*(y0-y1)/(max-min);
 [0,50,100].forEach(v=>{s.appendChild(el('line',{x1:x0,x2:x1,y1:Y(v),y2:Y(v),stroke:'rgba(252,249,242,.14)'}));s.appendChild(el('text',{...TX,x:x0-5,y:Y(v)+3,'text-anchor':'end','font-size':9,fill:'#cfe0de'},v+'%'))});
 const pts=A.map((a,i)=>[X(i),Y(a[1])]);const line='M'+pts.map(p=>p.join(',')).join('L');
 s.appendChild(el('path',{d:line+`L${pts[pts.length-1][0]},${y0}L${pts[0][0]},${y0}Z`,fill:'rgba(15,150,125,.22)'}));
 s.appendChild(el('path',{d:line,fill:'none',stroke:'#0F967D','stroke-width':3,'stroke-linejoin':'round'}));
 const showAll=W>360;
 A.forEach((a,i)=>{const last=i==A.length-1;s.appendChild(el('circle',{cx:pts[i][0],cy:pts[i][1],r:last?5:3.5,fill:last?'#F6B00E':'#FCF9F2',stroke:'#005461','stroke-width':1.5}));
  if(showAll||(A.length-1-i)%3==0)s.appendChild(el('text',{...TX,x:pts[i][0],y:pts[i][1]-8,'text-anchor':!showAll&&last?'end':'middle','font-size':10,'font-weight':600},a[1]+'%'));
  s.appendChild(el('text',{...TX,x:pts[i][0],y:H-3,'text-anchor':'middle','font-size':9,fill:'#cfe0de'},showAll?a[0]:a[0][0]))});
 box.appendChild(s)}
function draw(){ajustaLista();semanas();ano();escala()}
draw();let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,120)});
if(document.fonts){document.fonts.ready.then(draw);document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>draw())}

if(window.ResizeObserver){const ro=new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(draw,80)});['l-desl','l-atend','mapa'].forEach(id=>{const e=$(id);if(e)ro.observe(e)})}
</script>
